name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp --strict-checksums
  MAVEN_OPTS: -Xmx2g -XX:MaxMetaspaceSize=512m

jobs:
  build:
    name: JDK ${{ matrix.java }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['25']
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '.mvn/**') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Verify build
        run: ./mvnw $MAVEN_ARGS verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.os }}-jdk${{ matrix.java }}
          path: '**/target/site/jacoco/jacoco.xml'
          retention-days: 7
          if-no-files-found: ignore

  quality:
    name: Quality gate (SpotBugs + dependency analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '.mvn/**') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Dependency convergence
        run: ./mvnw $MAVEN_ARGS -Pstrict -DskipTests validate

      - name: SpotBugs and dependency analysis
        run: ./mvnw $MAVEN_ARGS -Pquality -DskipTests -Dspotbugs.skip=false verify

  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml', '.mvn/**') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build twice and compare checksums
        shell: bash
        run: |
          set -euo pipefail
          check() {
            ./mvnw -B -ntp -DskipTests -Dcheckstyle.skip -Dspotless.check.skip -Denforcer.skip clean package
            find . -name '*.jar' -path '*/target/*' -not -name '*-sources.jar' -not -name '*-javadoc.jar' \
              | sort | xargs sha256sum | sed 's#\./##'
          }
          check > /tmp/first.txt
          check > /tmp/second.txt
          if ! diff -u /tmp/first.txt /tmp/second.txt; then
            echo "::error::Build is not reproducible: artifact checksums differ between runs."
            exit 1
          fi
          echo "Reproducible build verified for $(wc -l < /tmp/first.txt) artifact(s)."
