version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      maven-patches:
        patterns: ['*']
        update-types: ['patch']
      maven-minor:
        patterns: ['*']
        update-types: ['minor']
      maven-plugin-patches:
        patterns: ['*']
        exclude-patterns: []
        update-types: ['patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Shanghai
    commit-message:
      prefix: 'ci'

